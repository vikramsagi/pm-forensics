[project]
name = "pm-forensics"
version = "0.1.0"
description = "Agent skills that check product work for problems people usually find too late. First skill: fact-drift."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
factdrift = "factdrift.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
